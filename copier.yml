# Copier configuration for the Agent Collab Treaty.
# https://copier.readthedocs.io/

_subdirectory: template
_min_copier_version: "9.0"
_exclude:
  - "{% if 'cursor' not in agent_pointers %}.cursor{% endif %}"
  - "{% if 'windsurf' not in agent_pointers %}.windsurf{% endif %}"

_message_after_copy: |
  Treaty installed. Next steps:
    1. Fill in the bracket-placeholders. The quickest way is to ask your agent:

           Fill out the docs in the treaty.

       It will read the repo and fill AGENTS.md and project_overview.md. Doing it
       by hand works too. Either way, leave treaty_conventions.md alone —
       upstream maintains it, and `treaty update` keeps it current.
    {%- if docs_dir not in ['.', ''] %}
       The working docs (treaty_conventions.md, next_steps.md, work_log.md,
       work_log_archive/) are in {{ docs_dir }}/; AGENTS.md and
       project_overview.md are at the repo root.
    {%- endif %}
    2. Commit .copier-answers.yml along with the docs. It stays at the repo root
       whatever docs_dir you chose, and `treaty update` / `treaty diff` read your
       answers and template pin from it. Commit any agent pointer files you
       selected too, so those tools can find AGENTS.md automatically.
    3. At the end of substantive work sessions, update work_log.md and
       next_steps.md according to AGENTS.md.
  {% if include_treaty_badge %}
    4. (Recommended) Add the Agent Collab Treaty badge near the top of your README.md
       to signal adoption. The tri-color version is the primary recommendation — its
       text is outlined to vector paths (no font dependency), so it renders identically
       on GitHub across every platform:

       ```markdown
       [![Agent Collab Treaty](https://raw.githubusercontent.com/yzhaoinuw/agent_collab_treaty/main/assets/treaty-adopted.svg)](https://github.com/yzhaoinuw/agent_collab_treaty)
       ```

       Fallback (single-color, via shields.io) only if your README also renders outside
       GitHub — e.g. on PyPI or npm — where raw SVG images may be blocked:
       ```markdown
       [![Agent Collab Treaty](https://img.shields.io/badge/Agent_Collab_Treaty-adopted-6d81f1?style=flat-square)](https://github.com/yzhaoinuw/agent_collab_treaty)
       ```
  {% endif %}

docs_dir:
  type: str
  help: |-
    Folder to keep the treaty's working docs in
    (treaty_conventions.md, next_steps.md, work_log.md,
    work_log_archive/), so they don't crowd your repo root.
    AGENTS.md, project_overview.md, and .copier-answers.yml
    always stay at the root.
    Answer '.' to keep everything flat at the root instead.
  default: "treaty_docs"

# Computed path prefixes derived from docs_dir. Declared with `when: false` so
# they are never prompted and never recorded, and *after* docs_dir because
# Copier renders defaults in declaration order.
#
# docs_prefix: root-level docs -> the docs folder ('' or 'treaty_docs/').
# root_prefix: docs-folder files -> the root ('' or '../').
docs_prefix:
  type: str
  when: false
  default: "{% if docs_dir in ['.', ''] %}{% else %}{{ docs_dir }}/{% endif %}"

root_prefix:
  type: str
  when: false
  default: "{% if docs_dir in ['.', ''] %}{% else %}{{ '../' * (docs_dir.strip('/').split('/') | length) }}{% endif %}"

integration_branch:
  type: str
  help: |-
    Integration branch (where PRs merge;
    usually main, master, or dev).
  default: "main"

env_activation:
  type: str
  help: |-
    Command to activate your dev environment, e.g.
    'conda activate myenv' or 'source .venv/bin/activate'.
    Answer 'none' if this project deliberately has no
    managed environment. Leave blank to fill in later.
  default: ""

verification_command:
  type: str
  help: |-
    Command that verifies the repo is in good shape - the
    CI-equivalent check. A test runner ('pytest', 'npm test'),
    a linter, a link checker, or 'treaty validate .' all fit
    this slot. Leave blank to fill in later.
  default: "{{ test_command | default('', true) }}"

has_releases:
  type: bool
  default: true
  help: |-
    Does this project cut releases or push version tags?
    Answering no drops the Release / Tag Checklist from
    AGENTS.md instead of leaving you to delete it.

uses_precommit:
  type: bool
  default: true
  help: |-
    Might this project run pre-commit (or a comparable
    formatter/linter hook)? Answering no drops the
    Pre-commit Note from AGENTS.md.

include_git_ownership_note:
  type: bool
  default: true
  help: |-
    Keep the 'dubious ownership' Git troubleshooting note in
    AGENTS.md? Mostly useful on Windows or shared machines;
    answer no to drop it.

agent_pointers:
  type: yaml
  multiselect: true
  help: |-
    Optional agent-specific pointer files, so tools that
    do not natively load AGENTS.md still follow the treaty.
  choices:
    "Claude Code / Cowork (CLAUDE.md)": "claude-code"
    "Cursor project rule (.cursor/rules/treaty.mdc)": "cursor"
    "Windsurf workspace rule (.windsurf/rules/treaty.md)": "windsurf"
    "Aider config (.aider.conf.yml)": "aider"
  default: []

include_treaty_badge:
  type: bool
  default: false
  help: |-
    Show paste-in instructions for the 'Agent Collab Treaty -
    adopted' badge in the post-install message. You add it to
    your README yourself; zero files are added to your repo.

# Legacy alias for verification_command, kept so projects initialized before
# v0.5.0 carry their recorded answer forward. Never prompted (`when: false`),
# and dropped from .copier-answers.yml on the next update. It must stay
# declared *after* verification_command: Copier renders each question's default
# in declaration order, so verification_command has to read the recorded value
# before this entry clears it.
test_command:
  type: str
  when: false
  default: ""
